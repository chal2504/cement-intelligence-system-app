name: Daily Cement Pulse
on:
  schedule:
    - cron: "17 11 * * 1-5"
    - cron: "17 13 * * 1-5"
    - cron: "17 15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Anthropic SDK
        run: pip install "anthropic>=0.40"
      - name: Generate daily pulse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/generate_pulse.py
      - name: Commit & push if the pulse changed
        run: |
          git config user.name "Cemento Robot (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily/pulse.json
          if git diff --cached --quiet; then
            echo "El pulso no cambio; nada que publicar."
          else
            git commit -m "Pulso diario $(date -u +%Y-%m-%d)"
            git push
          fi
